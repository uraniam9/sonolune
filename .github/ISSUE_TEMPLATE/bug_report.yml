name: Bug report
description: Something in SonoLune does not work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: dropdown
    id: suite
    attributes:
      label: Which part
      options:
        - Light
        - Sound
        - Focus
        - Mind
        - Presence Field
        - Lunar Arc
        - Night
        - The app in general
        - Not sure
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Nothing A065, Android 16"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SonoLune version
      description: Settings, at the bottom.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or a screen recording help more than a description.
